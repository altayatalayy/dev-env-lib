name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zig:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Zig
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.17.0

      - name: Check formatting
        run: zig fmt --check src test build.zig

      - name: Run unit tests
        run: zig build test --summary all

      - name: Build generic CLI
        run: zig build

      - name: Lint shell tests
        run: find test/e2e -name '*.sh' -print0 | xargs -0 shellcheck

      - name: Run container lifecycle tests
        run: |
          docker build --file test/Dockerfile --tag dev-env-lib-tests .
          docker run --rm --tmpfs /tmp:exec \
              --volume "${GITHUB_WORKSPACE}:/work:ro" \
              --env DEV_ENV_BIN_DIR=/work/zig-out/bin \
              --env DEV_ENV_TEST_TARGET=ubuntu-24.04-x86_64 \
              dev-env-lib-tests bash /work/test/e2e/fake/run.sh

  lean:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install elan
        run: |
          curl --fail --location --show-error --silent \
              https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              | sh -s -- -y --default-toolchain none

      - name: Build proofs and audit axioms
        run: formal/run.sh
